<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — PhishGuard</title>
  <meta name="description" content="Sign in or create a free PhishGuard account to save your scan history and access your dashboard." />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
<div id="toast-container" aria-live="polite" role="region" aria-label="Notifications"></div>

<div class="auth-container">
  <div class="auth-card animate-fade-in">

    <!-- Logo -->
    <div class="auth-logo">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--clr-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        <polyline points="9 12 11 14 15 10"/>
      </svg>
      <span class="text-gradient">PhishGuard</span>
    </div>

    <!-- Tab switcher -->
    <div class="tabs" role="tablist" aria-label="Authentication mode" style="margin-bottom: var(--space-xl);">
      <button class="tab-btn active" role="tab" data-auth-tab="login" id="auth-tab-login" aria-selected="true" aria-controls="login-panel">
        Log In
      </button>
      <button class="tab-btn" role="tab" data-auth-tab="register" id="auth-tab-register" aria-selected="false" aria-controls="register-panel">
        Sign Up
      </button>
    </div>

    <!-- ═══════════ LOGIN FORM ════════════ -->
    <div id="login-panel" role="tabpanel" aria-labelledby="auth-tab-login">
      <form id="login-form" novalidate>
        <div class="form-group" style="margin-bottom: var(--space-md);">
          <label class="form-label" for="login-username">Username</label>
          <input type="text" id="login-username" class="form-input" placeholder="your_username"
                 autocomplete="username" autocapitalize="none" required />
          <span class="form-error" id="login-username-err" role="alert"></span>
        </div>

        <div class="form-group" style="margin-bottom: var(--space-lg);">
          <label class="form-label" for="login-password">Password</label>
          <div style="position:relative;">
            <input type="password" id="login-password" class="form-input" placeholder="••••••••"
                   autocomplete="current-password" required />
            <button type="button" class="btn btn-ghost btn-sm" id="login-toggle-pw"
                    style="position:absolute; right:8px; top:50%; transform:translateY(-50%); padding:4px 8px;"
                    aria-label="Toggle password visibility">👁</button>
          </div>
          <span class="form-error" id="login-pw-err" role="alert"></span>
        </div>

        <!-- Global error -->
        <div id="login-error" class="form-error" style="margin-bottom:var(--space-md); font-size:0.875rem;" role="alert"></div>

        <button type="submit" id="login-submit" class="btn btn-primary" style="width:100%;" aria-busy="false">
          <span class="btn-text">Log In</span>
        </button>
      </form>

      <div class="auth-divider">or</div>

      <p class="text-sm text-muted" style="text-align:center;">
        Don't have an account?
        <button class="btn btn-ghost btn-sm" data-auth-tab="register" style="display:inline; padding:0; color:var(--clr-accent);">Sign up free</button>
      </p>
    </div>

    <!-- ═══════════ REGISTER FORM ════════════ -->
    <div id="register-panel" role="tabpanel" aria-labelledby="auth-tab-register" style="display:none;">
      <form id="register-form" novalidate>
        <div class="form-group" style="margin-bottom: var(--space-md);">
          <label class="form-label" for="reg-username">Username</label>
          <input type="text" id="reg-username" class="form-input" placeholder="choose_a_username"
                 autocomplete="username" autocapitalize="none" minlength="3" maxlength="80" required />
          <span class="form-error" id="reg-username-err" role="alert"></span>
        </div>

        <div class="form-group" style="margin-bottom: var(--space-md);">
          <label class="form-label" for="reg-email">Email Address</label>
          <input type="email" id="reg-email" class="form-input" placeholder="you@example.com"
                 autocomplete="email" required />
          <span class="form-error" id="reg-email-err" role="alert"></span>
        </div>

        <div class="form-group" style="margin-bottom: var(--space-md);">
          <label class="form-label" for="reg-password">Password</label>
          <div style="position:relative;">
            <input type="password" id="reg-password" class="form-input" placeholder="Min. 8 characters"
                   autocomplete="new-password" minlength="8" required />
            <button type="button" class="btn btn-ghost btn-sm" id="reg-toggle-pw"
                    style="position:absolute; right:8px; top:50%; transform:translateY(-50%); padding:4px 8px;"
                    aria-label="Toggle password visibility">👁</button>
          </div>
          <span class="form-error" id="reg-pw-err" role="alert"></span>
          <!-- Strength bar -->
          <div id="pw-strength-track" class="risk-bar-track" style="height:4px; margin-top:6px;">
            <div id="pw-strength-fill" class="risk-bar-fill safe" style="width:0%; transition:width 0.3s ease;"></div>
          </div>
          <span id="pw-strength-label" class="text-xs text-muted" style="margin-top:4px; display:block;"></span>
        </div>

        <div class="form-group" style="margin-bottom: var(--space-lg);">
          <label class="form-label" for="reg-confirm">Confirm Password</label>
          <input type="password" id="reg-confirm" class="form-input" placeholder="Repeat password"
                 autocomplete="new-password" required />
          <span class="form-error" id="reg-confirm-err" role="alert"></span>
        </div>

        <!-- Global error -->
        <div id="register-error" class="form-error" style="margin-bottom:var(--space-md); font-size:0.875rem;" role="alert"></div>

        <button type="submit" id="reg-submit" class="btn btn-primary" style="width:100%;" aria-busy="false">
          <span class="btn-text">Create Account</span>
        </button>
      </form>

      <div class="auth-divider">or</div>

      <p class="text-sm text-muted" style="text-align:center;">
        Already have an account?
        <button class="btn btn-ghost btn-sm" data-auth-tab="login" style="display:inline; padding:0; color:var(--clr-accent);">Log in</button>
      </p>
    </div>

    <!-- Back link -->
    <p style="text-align:center; margin-top:var(--space-lg);">
      <a href="index.html" class="text-sm text-muted" style="color:var(--clr-text-muted);">← Back to Scanner</a>
    </p>
  </div>
</div>

<script src="assets/js/toast.js"></script>
<script src="assets/js/api.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {

  // Redirect if already logged in
  if (Api.getToken()) {
    window.location.href = 'dashboard.html';
    return;
  }

  // ── Tab switching ──────────────────────────────────────────────────────
  const panels = { login: document.getElementById('login-panel'), register: document.getElementById('register-panel') };
  const tabs   = { login: document.getElementById('auth-tab-login'), register: document.getElementById('auth-tab-register') };

  function switchTab(tab) {
    Object.entries(panels).forEach(([k, el]) => el.style.display = k === tab ? 'block' : 'none');
    Object.entries(tabs).forEach(([k, el]) => {
      el.classList.toggle('active', k === tab);
      el.setAttribute('aria-selected', k === tab);
    });
  }

  document.querySelectorAll('[data-auth-tab]').forEach(el => {
    el.addEventListener('click', () => switchTab(el.dataset.authTab));
  });

  // Check URL param ?tab=register
  if (new URLSearchParams(location.search).get('tab') === 'register') switchTab('register');

  // ── Password visibility toggles ────────────────────────────────────────
  function setupToggle(btnId, inputId) {
    document.getElementById(btnId).addEventListener('click', () => {
      const inp = document.getElementById(inputId);
      inp.type = inp.type === 'password' ? 'text' : 'password';
    });
  }
  setupToggle('login-toggle-pw', 'login-password');
  setupToggle('reg-toggle-pw', 'reg-password');

  // ── Password strength ──────────────────────────────────────────────────
  document.getElementById('reg-password').addEventListener('input', function() {
    const v = this.value;
    let score = 0;
    if (v.length >= 8) score++;
    if (/[A-Z]/.test(v)) score++;
    if (/[0-9]/.test(v)) score++;
    if (/[^A-Za-z0-9]/.test(v)) score++;

    const fill  = document.getElementById('pw-strength-fill');
    const label = document.getElementById('pw-strength-label');
    const pct   = score * 25;
    fill.style.width = `${pct}%`;
    fill.className = `risk-bar-fill ${score <= 1 ? 'phishing' : score === 2 ? 'suspicious' : 'safe'}`;
    label.textContent = ['', 'Weak', 'Fair', 'Good', 'Strong'][score] || '';
  });

  // ── Helpers ────────────────────────────────────────────────────────────
  function showErr(id, msg) {
    const el = document.getElementById(id);
    if (!el) return;
    el.textContent = msg;
    el.classList.toggle('visible', !!msg);
  }

  function setLoading(btnId, on) {
    const btn = document.getElementById(btnId);
    btn.disabled = on;
    btn.classList.toggle('loading', on);
    btn.setAttribute('aria-busy', on);
  }

  // ── Login ──────────────────────────────────────────────────────────────
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    showErr('login-error', '');

    const username = document.getElementById('login-username').value.trim();
    const password = document.getElementById('login-password').value;

    if (!username) { showErr('login-username-err', 'Username is required.'); return; }
    if (!password) { showErr('login-pw-err', 'Password is required.'); return; }

    setLoading('login-submit', true);
    try {
      await Api.login({ username, password });
      Toast.show('Welcome back! Redirecting…', 'success');
      setTimeout(() => window.location.href = 'dashboard.html', 800);
    } catch (err) {
      showErr('login-error', err.message);
      setLoading('login-submit', false);
    }
  });

  // ── Register ───────────────────────────────────────────────────────────
  document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    ['reg-username-err','reg-email-err','reg-pw-err','reg-confirm-err','register-error'].forEach(id => showErr(id, ''));

    const username = document.getElementById('reg-username').value.trim();
    const email    = document.getElementById('reg-email').value.trim();
    const password = document.getElementById('reg-password').value;
    const confirm  = document.getElementById('reg-confirm').value;

    let valid = true;
    if (!username || username.length < 3) { showErr('reg-username-err', 'Min. 3 characters.'); valid = false; }
    if (!email || !email.includes('@'))   { showErr('reg-email-err', 'Valid email required.'); valid = false; }
    if (!password || password.length < 8) { showErr('reg-pw-err', 'Min. 8 characters.');       valid = false; }
    if (password !== confirm)             { showErr('reg-confirm-err', 'Passwords do not match.'); valid = false; }
    if (!valid) return;

    setLoading('reg-submit', true);
    try {
      await Api.register({ username, email, password });
      Toast.show('Account created! Redirecting…', 'success');
      setTimeout(() => window.location.href = 'dashboard.html', 800);
    } catch (err) {
      showErr('register-error', err.message);
      setLoading('reg-submit', false);
    }
  });
});
</script>
</body>
</html>
